[custom]
;设置匹配规则



ruleset=直连,[]DOMAIN-SUFFIX,taihaol.top
# 1. 最精准：谷歌中国区专属域名直连（优先匹配，避免被通用规则覆盖）
ruleset=直连,[]DOMAIN-SUFFIX,xn--ngstr-lra8j.com
ruleset=直连,[]DOMAIN-SUFFIX,services.googleapis.cn
# 2. 次精准：谷歌中国区 IP/域名规则库（补充专属域名外的谷歌中国服务）
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCNProxyIP.list
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleCN.list
# 3. 通用白名单：推送/基础服务（保障小米/谷歌/微软推送不被拦截）
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
# 4. 局域网：内网设备优先直连（避免内网请求走代理）
ruleset=直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
# 5. 兜底：所有中国 IP 直连（最后匹配，覆盖未命中上面规则的国内 IP）
ruleset=直连,[]GEOIP,CN

ruleset=电报,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
# 电报尝试选择低成本节点

ruleset=国外,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=国外,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=国外,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
# 谷歌公司
ruleset=国外,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Bing.list
ruleset=国外,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list
ruleset=国外,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
# 微软公司
ruleset=国外,https://raw.githubusercontent.com/taihaol-666/clash/refs/heads/main/github.list
# github
ruleset=国外,https://raw.githubusercontent.com/Special-Care/ACL4SSR/refs/heads/main/Clash/Ruleset/Twitter.list
# 推特
ruleset=国外,https://raw.githubusercontent.com/Special-Care/ACL4SSR/refs/heads/main/Clash/Ruleset/Instagram.list
# ins
ruleset=国外,https://raw.githubusercontent.com/Special-Care/ACL4SSR/refs/heads/main/Clash/Ruleset/Docker.list
ruleset=国外,[]DOMAIN-KEYWORD,docker
# docker
ruleset=国外,[]DOMAIN-SUFFIX,wikipedia.org
#维基百科

# ruleset=未匹配,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
# 国外媒体列表



ruleset=游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Epic.list
ruleset=游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Origin.list
ruleset=游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Sony.list
ruleset=游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list
ruleset=游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Nintendo.list


ruleset=未匹配,[]FINAL
# 所有未匹配的流量，使用"未匹配"策略组


;设置分组标志位
custom_proxy_group=直连`select`[]DIRECT`[]香港节点
custom_proxy_group=手动1`select`.*
custom_proxy_group=手动2`select`.*
custom_proxy_group=香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong)`http://www.gstatic.com/generate_204`300,,50
# custom_proxy_group=香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong)(.*?)(1x|1X)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=国外`select`[]香港节点`[]手动1`[]手动2`[]DIRECT`.*
custom_proxy_group=游戏平台`select`[]香港节点`[]手动1`[]手动2`[]DIRECT`.*
custom_proxy_group=电报`select`[]香港节点`[]手动1`[]手动2`[]DIRECT`.*
custom_proxy_group=未匹配`select`[]DIRECT`[]香港节点`[]手动1`[]手动2`.*


enable_rule_generator=true
overwrite_original_rules=true

;clash_rule_base=https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GeneralClashConfig.yml

;luck
